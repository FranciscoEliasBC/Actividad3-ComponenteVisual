<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Componente Modal</title>
    <link rel="stylesheet" href="css/componente.css">
</head>
<body>
    <header class="header">
        <h1>Librería de Componente Visual Modal</h1>
    </header>
    <main class="container">
        <section class="card">
            <h2>Prueba de Componente Reutilizable</h2>
            <p>Haz clic en cualquiera de los siguientes botones:</p>  
            <div class="button-group">
                <button id="btn-info" class="btn btn-primary">Abrir Modal Informativa</button>
                <button id="btn-confirm" class="btn btn-warning">Abrir Modal de Confirmación</button>
                <button id="btn-custom" class="btn btn-success">Abrir Modal con HTML Personalizado</button>
            </div>
        </section>
    </main>
    <script src="js/componente.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
